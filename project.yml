name: GymBlox
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  SpotifySDK:
    url: https://github.com/spotify/ios-sdk.git
    revision: 0b3e54771738ad5e64f22c8e5e19ca76d6becc6c
targets:
  GymBlox:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Setline
        excludes: [Info.plist, .git, Assets.xcassets]
      - path: Setline/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.setline
        INFOPLIST_FILE: Setline/Info.plist
        PRODUCT_NAME: GymBlox
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPOTIFY_CLIENT_ID: "97c47cb88d76499ea7d0047b0bc01d45"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: SpotifySDK
        product: SpotifyiOS
  GymBloxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources: [SetlineTests]
    dependencies:
      - target: GymBlox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.setline.tests
  GymBloxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [SetlineUITests]
    dependencies:
      - target: GymBlox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.setline.uitests
        TEST_TARGET_NAME: GymBlox
schemes:
  GymBlox:
    build:
      targets:
        GymBlox: all
    test:
      targets: [GymBloxTests, GymBloxUITests]

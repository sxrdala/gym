name: Build GymBlox IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          find Setline SetlineTests SetlineUITests -type f -name '*.swift' -exec xcrun swiftc -frontend -parse {} +
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GymBlox.xcodeproj -scheme GymBlox -derivedDataPath build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project GymBlox.xcodeproj \
            -scheme GymBlox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and verify IPA
        run: |
          app="build/Build/Products/Release-iphoneos/GymBlox.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = "GymBlox"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = "16.0"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo "$app/$executable" -verify_arch arm64
          mkdir -p build/ipa/Payload
          ditto "$app" build/ipa/Payload/GymBlox.app
          ditto -c -k --keepParent build/ipa/Payload build/GymBlox.ipa
          unzip -tq build/GymBlox.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymBlox-unsigned
          path: build/GymBlox.ipa
          if-no-files-found: error
          compression-level: 0

  simulator-tests:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run journal and 4.7-inch layout tests
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(xcrun simctl list runtimes --json | jq -er --arg sdk "$sdk" '
            [.runtimes[] | select(.isAvailable and (.identifier | contains("SimRuntime.iOS-")))
              | select((.version | split(".") | map(tonumber)) <= ($sdk | split(".") | map(tonumber)))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          device="$(xcrun simctl create "GymBlox 4.7 inch" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime")"
          mkdir -p build
          xcodebuild test \
            -project GymBlox.xcodeproj \
            -scheme GymBlox \
            -destination "platform=iOS Simulator,id=$device" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/GymBloxTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GymBlox-simulator-tests
          path: build/GymBloxTests.xcresult
          if-no-files-found: ignore
